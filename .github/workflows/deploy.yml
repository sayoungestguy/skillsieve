name: deploy

# Builds multi-arch images, scans them, then helm-upgrades the Oracle VM.
# ON HOLD while the app is self-hosted (deploy/local/k3d-up.sh): manual trigger only.
# To re-enable, add back:  workflow_run: { workflows: [ci], types: [completed], branches: [main] }
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build-web:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      registry: ${{ steps.meta.outputs.registry }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: meta
        run: |
          echo "tag=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push web (arm64 + amd64)
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          platforms: linux/arm64,linux/amd64
          push: true
          # Set repo variable WEB_USE_MOCKS=true to ship the demo-data build instead.
          build-args: VITE_USE_MOCKS=${{ vars.WEB_USE_MOCKS || 'false' }}
          tags: |
            ${{ steps.meta.outputs.registry }}/skillsieve-web:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.registry }}/skillsieve-web:main
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: Build and push core-api (arm64 + amd64)
        uses: docker/build-push-action@v6
        with:
          context: services/core-api
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.registry }}/skillsieve-core-api:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.registry }}/skillsieve-core-api:main
          cache-from: type=gha,scope=core-api
          cache-to: type=gha,scope=core-api,mode=max
      - name: Build and push skills-svc (arm64 + amd64)
        uses: docker/build-push-action@v6
        with:
          context: services/skills-svc
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.registry }}/skillsieve-skills-svc:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.registry }}/skillsieve-skills-svc:main
          cache-from: type=gha,scope=skills-svc
          cache-to: type=gha,scope=skills-svc,mode=max
      - name: Trivy image scan (skills-svc)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.registry }}/skillsieve-skills-svc:${{ steps.meta.outputs.tag }}
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Trivy image scan (web)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.registry }}/skillsieve-web:${{ steps.meta.outputs.tag }}
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Trivy image scan (core-api)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.registry }}/skillsieve-core-api:${{ steps.meta.outputs.tag }}
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: '1'

  deploy:
    needs: build-web
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://${{ vars.APP_HOST }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Package and push chart to GHCR (OCI)
        id: chart
        env:
          REGISTRY: ${{ needs.build-web.outputs.registry }}
          TAG: ${{ needs.build-web.outputs.tag }}
        run: |
          base=$(awk '/^version:/ {print $2}' deploy/helm/skillsieve/Chart.yaml)
          version="${base}-${TAG/-/}"            # e.g. 0.1.0-sha1a2b3c4
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package deploy/helm/skillsieve --version "$version" --app-version "$TAG" -d /tmp/chart
          helm push "/tmp/chart/skillsieve-${version}.tgz" "oci://${REGISTRY}/charts"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: helm upgrade on the VM
        env:
          VM: ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}
          REGISTRY: ${{ needs.build-web.outputs.registry }}
          TAG: ${{ needs.build-web.outputs.tag }}
          VERSION: ${{ steps.chart.outputs.version }}
          HOST: ${{ vars.APP_HOST }}
        # Prod values travel over stdin (-f -) so the VM needs no repo checkout.
        run: |
          # shellcheck disable=SC2029  # expanding on the runner is intended
          ssh "$VM" "helm upgrade --install skillsieve oci://${REGISTRY}/charts/skillsieve \
            --version ${VERSION} --namespace skillsieve --atomic --timeout 5m -f - \
            --set imageRegistry=${REGISTRY} --set web.image.tag=${TAG} --set coreApi.image.tag=${TAG} --set skillsSvc.image.tag=${TAG} \
            --set ingress.host=${HOST}" \
            < deploy/helm/skillsieve/values-prod.yaml
      - name: Smoke test
        run: |
          for _ in $(seq 1 20); do
            curl -fsS "https://${{ vars.APP_HOST }}/healthz" \
              && curl -fsS "https://${{ vars.APP_HOST }}/api/actuator/health" && exit 0
            sleep 15
          done
          echo "smoke test failed" >&2; exit 1
