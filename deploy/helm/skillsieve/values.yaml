# Defaults for local clusters (k3d/kind). Production overrides live in values-prod.yaml.
imageRegistry: ghcr.io/sayoungestguy   # GHCR namespace; deploy.yml sets it from the repo owner

web:
  enabled: true
  replicas: 1
  image:
    repository: skillsieve-web
    tag: ""            # required: sha-<short>; never latest
    pullPolicy: IfNotPresent
  resources:           # docs/ARCHITECTURE.md §6
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 200m, memory: 64Mi }

coreApi:
  enabled: true
  replicas: 1
  image:
    repository: skillsieve-core-api
    tag: ""            # required: sha-<short>
    pullPolicy: IfNotPresent
  resources:           # docs/ARCHITECTURE.md §6; JVM heap = 75% of the limit
    requests: { cpu: 100m, memory: 384Mi }
    limits: { cpu: "1", memory: 768Mi }
  # Non-secret settings (TECHNICAL_DESIGN §8).
  env:
    COOKIE_SECURE: "true"
    DEMO_MODE: "false"
  # Secret with SPRING_DATASOURCE_URL/_USERNAME/_PASSWORD, JWT_SECRET, OWNER_EMAIL,
  # OWNER_PASSWORD_HASH, INTERNAL_TOKEN (same value as skills-svc). Created by sealedSecret below (prod) or by deploy/local/k3d-up.sh (local).
  secretName: core-api-secrets
  # Prod: paste `kubeseal` output here (encrypted, safe to commit). Empty = don't render.
  sealedSecret:
    encryptedData: {}

skillsSvc:
  enabled: true
  replicas: 1          # in-process LLM budget assumes one replica (TECHNICAL_DESIGN §7)
  image:
    repository: skillsieve-skills-svc
    tag: ""            # required: sha-<short>
    pullPolicy: IfNotPresent
  resources:           # docs/ARCHITECTURE.md §6
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }
  env:
    GEMINI_MODEL: gemini-3.5-flash-lite
    PROMPT_VERSION: extract-v1
    LLM_RPM: "4"
    LLM_RPD: "200"
  # Secret with DATABASE_URL, INTERNAL_TOKEN, GEMINI_API_KEY (empty key = extraction off) and
  # AMQP_URL (R2, needed when rabbitmq.enabled; empty = no queue worker).
  secretName: skills-svc-secrets
  sealedSecret:
    encryptedData: {}

elasticsearch:
  enabled: true
  image: elasticsearch:8.18.8@sha256:e5b3511e96ee1c58e9027d9d06185be4e627074717b40f6145e860b39c851d6d   # official image (Docker Hub mirror)
  heap: 1g             # docs/ARCHITECTURE.md §6
  resources:
    requests: { cpu: 200m, memory: 1536Mi }
    limits: { cpu: "1", memory: 2Gi }
  storage: 10Gi
  storageClass: local-path   # k3s default provisioner

rabbitmq:
  enabled: false       # R2 async extraction (ADR-006); also sets core-api EXTRACTION_MODE=async
  image: rabbitmq:4.1-alpine@sha256:cd4009416f83d7e5895020cd71b0963f3b8a4dfc3de74bbb6fb3bfe5f81f01e0
  resources:           # docs/ARCHITECTURE.md §6
    requests: { cpu: 50m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
  storage: 1Gi
  storageClass: local-path
  # Secret with RABBITMQ_DEFAULT_USER / RABBITMQ_DEFAULT_PASS. core-api-secrets must hold the same
  # pair as SPRING_RABBITMQ_USERNAME / SPRING_RABBITMQ_PASSWORD. Created by deploy/local/k3d-up.sh.
  secretName: rabbitmq-secrets

observability:
  # R2 metrics (TECHNICAL_DESIGN §11). Prometheus scrapes pods annotated prometheus.io/scrape.
  enabled: false
  prometheus:
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    retention: 7d
    retentionSize: 1500MB
    scrapeInterval: 30s
    resources:           # docs/ARCHITECTURE.md §6
      requests: { cpu: 50m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }
    storage: 2Gi
    storageClass: local-path
  grafana:
    image: grafana/grafana:12.1.1@sha256:a1701c2180249361737a99a01bc770db39381640e4d631825d38ff4535efa47d
    path: /grafana       # served under the app's host by the Ingress
    rootUrl: ""          # full public URL incl. /grafana/ (k3d-up sets it); empty = derived from the request
    resources:
      requests: { cpu: 20m, memory: 96Mi }
      limits: { cpu: 300m, memory: 256Mi }
    # Secret with GF_SECURITY_ADMIN_USER / GF_SECURITY_ADMIN_PASSWORD. Created by deploy/local/k3d-up.sh.
    secretName: grafana-secrets
  # R2 logs: Loki stores, Alloy ships (tails pod logs via the Kubernetes API). Needs enabled: true above.
  loki:
    enabled: true
    image: grafana/loki:3.5.5@sha256:31628519045e7f28692a7ae73b4a3fd293dccb425585ed5d16ceea3b5c9592e6
    retention: 168h      # 7 days, enforced by the compactor
    resources:
      requests: { cpu: 50m, memory: 192Mi }
      limits: { cpu: 500m, memory: 384Mi }
    storage: 2Gi
    storageClass: local-path
  alloy:
    image: grafana/alloy:v1.10.2@sha256:bcf27f18c4402869af112fb39e35e1db3804a404686f4caa20bdf77814219223
    resources:
      requests: { cpu: 20m, memory: 64Mi }
      limits: { cpu: 200m, memory: 192Mi }

ingress:
  enabled: true
  className: traefik
  host: skillsieve.localhost
  tls:
    enabled: false
    clusterIssuer: letsencrypt-prod
