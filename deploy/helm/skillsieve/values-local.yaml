# Self-hosted cluster (k3d on macOS or WSL). Reachable by any hostname/IP on the LAN, plain HTTP.
imageRegistry: docker.io/library
web:
  image:
    pullPolicy: Never   # images are imported into k3d, not pulled
coreApi:
  image:
    pullPolicy: Never
  env:
    COOKIE_SECURE: "false"   # plain HTTP on the LAN; see deploy/local/README.md
    DEMO_MODE: "false"

skillsSvc:
  image:
    pullPolicy: Never

ingress:
  host: ""
  tls:
    enabled: false
