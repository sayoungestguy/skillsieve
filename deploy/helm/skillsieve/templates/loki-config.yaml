{{- if and .Values.observability.enabled .Values.observability.loki.enabled }}
{{- $ctx := dict "root" . "component" "loki" "tag" "3.5.5" }}
{{- $l := .Values.observability.loki }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-loki
  labels:
    {{- include "skillsieve.labels" $ctx | nindent 4 }}
data:
  loki.yaml: |
    # Single binary, filesystem storage, no auth (ClusterIP only; Grafana is the only reader).
    auth_enabled: false
    server:
      http_listen_port: 3100
      grpc_listen_port: 9095
      log_level: warn
    common:
      path_prefix: /loki
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
    schema_config:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      retention_period: {{ $l.retention }}
      ingestion_rate_mb: 2
      ingestion_burst_size_mb: 4
    compactor:
      working_directory: /loki/compactor
      retention_enabled: true
      delete_request_store: filesystem
    query_range:
      results_cache:
        cache:
          embedded_cache:
            enabled: true
            max_size_mb: 32
    ruler:
      enable_api: false
    analytics:
      reporting_enabled: false
{{- end }}
