{{- if .Values.skillsSvc.enabled }}
{{- $ctx := dict "root" . "component" "skills-svc" "tag" .Values.skillsSvc.image.tag }}
# Internal only: no ingress route (ARCHITECTURE §7).
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-skills-svc
  labels:
    {{- include "skillsieve.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "skillsieve.selector" $ctx | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
{{- end }}
