{{- if .Values.observability.enabled }}
{{- $ctx := dict "root" . "component" "grafana" "tag" "12.1.1" }}
{{- $g := .Values.observability.grafana }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-grafana
  labels:
    {{- include "skillsieve.labels" $ctx | nindent 4 }}
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://{{ .Release.Name }}-prometheus:9090
        isDefault: true
        editable: false
      {{- if .Values.observability.loki.enabled }}
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://{{ .Release.Name }}-loki:3100
        editable: false
        jsonData:
          maxLines: 1000
      {{- end }}
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: skillsieve
        folder: SkillSieve
        type: file
        disableDeletion: true
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards
  {{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
  {{- if or $.Values.observability.loki.enabled (ne (base $path) "skillsieve-logs.json") }}
  {{ base $path }}: |
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
  {{- end }}
{{- end }}
