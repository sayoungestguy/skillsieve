{{- if .Values.rabbitmq.enabled }}
{{- $ctx := dict "root" . "component" "rabbitmq" "tag" "4.1" }}
# Single node broker for async extraction (ADR-006). In-cluster only (ClusterIP), no management UI.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-rabbitmq
  labels:
    {{- include "skillsieve.labels" $ctx | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}-rabbitmq
  replicas: 1
  selector:
    matchLabels:
      {{- include "skillsieve.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "skillsieve.labels" $ctx | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 100       # the image's rabbitmq user
        runAsGroup: 101
        fsGroup: 101
      containers:
        - name: rabbitmq
          image: {{ .Values.rabbitmq.image }}
          ports:
            - name: amqp
              containerPort: 5672
          envFrom:
            - secretRef:
                name: {{ .Values.rabbitmq.secretName }}
          env:
            - { name: RABBITMQ_NODENAME, value: rabbit@localhost }   # stable across pod restarts
            - { name: RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS, value: "+S 1:1" }   # 1 scheduler: small VM
          readinessProbe:
            exec: { command: ["rabbitmq-diagnostics", "-q", "check_port_connectivity"] }
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            exec: { command: ["rabbitmq-diagnostics", "-q", "ping"] }
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            {{- toYaml .Values.rabbitmq.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.rabbitmq.storageClass }}
        resources:
          requests:
            storage: {{ .Values.rabbitmq.storage }}
{{- end }}
