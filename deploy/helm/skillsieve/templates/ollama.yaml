{{- if .Values.ollama.enabled }}
{{- $ctx := dict "root" . "component" "ollama" "tag" "0.13.0" }}
{{- $o := .Values.ollama }}
# Local LLM for resume tailoring (FR-12). Resume text stays in the cluster: never sent to Gemini.
# In-cluster only (ClusterIP); skills-svc is the only client.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-ollama
  labels:
    {{- include "skillsieve.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "skillsieve.selector" $ctx | nindent 4 }}
  ports:
    - name: http
      port: 11434
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-ollama
  labels:
    {{- include "skillsieve.labels" $ctx | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}-ollama
  replicas: 1
  selector:
    matchLabels:
      {{- include "skillsieve.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "skillsieve.labels" $ctx | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: ollama
          image: {{ $o.image }}
          # Serve, then pull the model once (kept on the PVC). Ready only after the pull.
          command: ["/bin/sh", "-c"]
          args:
            - |
              ollama serve &
              until ollama list >/dev/null 2>&1; do sleep 1; done
              ollama pull "$MODEL" && touch /tmp/model-ready
              wait
          env:
            - { name: MODEL, value: {{ $o.model | quote }} }
            - { name: HOME, value: /tmp }
            - { name: OLLAMA_HOST, value: "0.0.0.0:11434" }
            - { name: OLLAMA_MODELS, value: /models }
            - { name: OLLAMA_KEEP_ALIVE, value: {{ $o.keepAlive | quote }} }   # unload when idle to free RAM
            - { name: OLLAMA_NUM_PARALLEL, value: "1" }
            - { name: OLLAMA_MAX_LOADED_MODELS, value: "1" }
            - { name: OLLAMA_NOPRUNE, value: "1" }
          ports:
            - name: http
              containerPort: 11434
          startupProbe:              # first start downloads the model (~1 GB)
            exec: { command: ["test", "-f", "/tmp/model-ready"] }
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            exec: { command: ["test", "-f", "/tmp/model-ready"] }
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            {{- toYaml $o.resources | nindent 12 }}
          securityContext:
            {{- include "skillsieve.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - name: models
              mountPath: /models
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
  volumeClaimTemplates:
    - metadata:
        name: models
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ $o.storageClass }}
        resources:
          requests:
            storage: {{ $o.storage }}
{{- end }}
