{{- if and .Values.coreApi.enabled .Values.coreApi.sealedSecret.encryptedData }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Values.coreApi.secretName }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: skillsieve
spec:
  encryptedData:
    {{- toYaml .Values.coreApi.sealedSecret.encryptedData | nindent 4 }}
  template:
    metadata:
      name: {{ .Values.coreApi.secretName }}
{{- end }}
