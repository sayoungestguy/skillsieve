{{- if and .Values.observability.enabled .Values.observability.loki.enabled }}
{{- $ctx := dict "root" . "component" "alloy" "tag" "v1.10.2" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-alloy
  labels:
    {{- include "skillsieve.labels" $ctx | nindent 4 }}
data:
  config.alloy: |
    // Tail logs of this release's pods through the Kubernetes API (no hostPath, no root)
    // and push them to Loki with app/component/pod/container labels.
    discovery.kubernetes "pods" {
      role = "pod"
      namespaces {
        names = ["{{ .Release.Namespace }}"]
      }
      selectors {
        role  = "pod"
        label = "app.kubernetes.io/instance={{ .Release.Name }}"
      }
    }

    discovery.relabel "pods" {
      targets = discovery.kubernetes.pods.targets
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_component"]
        target_label  = "component"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
    }

    loki.source.kubernetes "pods" {
      targets    = discovery.relabel.pods.output
      forward_to = [loki.process.levels.receiver]
    }

    // Pull a "level" label out of JSON (skills-svc, core-api) or plain-text logs.
    loki.process "levels" {
      stage.regex {
        expression = `(?i)"?(level|severity)"?\s*[:=]\s*"?(?P<level>debug|info|warn|warning|error|fatal|critical)`
      }
      stage.template {
        source   = "level"
        template = `{{ "{{" }} ToLower .Value {{ "}}" }}`
      }
      stage.labels {
        values = { level = "" }
      }
      forward_to = [loki.write.default.receiver]
    }

    loki.write "default" {
      endpoint {
        url = "http://{{ .Release.Name }}-loki:3100/loki/api/v1/push"
      }
    }
{{- end }}
