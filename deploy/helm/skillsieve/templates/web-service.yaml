{{- if .Values.web.enabled }}
{{- $ctx := dict "root" . "component" "web" "tag" .Values.web.image.tag }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-web
  labels:
    {{- include "skillsieve.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "skillsieve.selector" $ctx | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- end }}
