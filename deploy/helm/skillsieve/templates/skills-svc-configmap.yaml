{{- if .Values.skillsSvc.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-skills-svc
  labels:
    {{- include "skillsieve.labels" (dict "root" . "component" "skills-svc" "tag" .Values.skillsSvc.image.tag) | nindent 4 }}
data:
  {{- range $k, $v := .Values.skillsSvc.env }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- if .Values.ollama.enabled }}
  OLLAMA_URL: "http://{{ .Release.Name }}-ollama:11434"
  OLLAMA_MODEL: {{ .Values.ollama.model | quote }}
  {{- else if .Values.ollama.externalUrl }}
  OLLAMA_URL: {{ .Values.ollama.externalUrl | quote }}
  OLLAMA_MODEL: {{ .Values.ollama.model | quote }}
  {{- end }}
{{- end }}
