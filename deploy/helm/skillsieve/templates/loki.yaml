{{- if and .Values.observability.enabled .Values.observability.loki.enabled }}
{{- $ctx := dict "root" . "component" "loki" "tag" "3.5.5" }}
{{- $l := .Values.observability.loki }}
# Loki single binary: stores logs shipped by Alloy, queried by Grafana. In-cluster only.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-loki
  labels:
    {{- include "skillsieve.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "skillsieve.selector" $ctx | nindent 4 }}
  ports:
    - name: http
      port: 3100
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-loki
  labels:
    {{- include "skillsieve.labels" $ctx | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}-loki
  replicas: 1
  selector:
    matchLabels:
      {{- include "skillsieve.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "skillsieve.labels" $ctx | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/loki-config.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 10001     # the image's loki user
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: loki
          image: {{ $l.image }}
          args:
            - -config.file=/etc/loki/loki.yaml
            - -target=all
          ports:
            - name: http
              containerPort: 3100
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            {{- toYaml $l.resources | nindent 12 }}
          securityContext:
            {{- include "skillsieve.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/loki
            - name: data
              mountPath: /loki
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-loki
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ $l.storageClass }}
        resources:
          requests:
            storage: {{ $l.storage }}
{{- end }}
