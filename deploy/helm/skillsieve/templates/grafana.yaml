{{- if .Values.observability.enabled }}
{{- $ctx := dict "root" . "component" "grafana" "tag" "12.1.1" }}
{{- $g := .Values.observability.grafana }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-grafana
  labels:
    {{- include "skillsieve.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "skillsieve.selector" $ctx | nindent 4 }}
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-grafana
  labels:
    {{- include "skillsieve.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "skillsieve.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "skillsieve.labels" $ctx | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/grafana-config.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 472       # the image's grafana user
        runAsGroup: 0
        fsGroup: 472
      containers:
        - name: grafana
          image: {{ $g.image }}
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: {{ $g.secretName }}
          env:
            - { name: GF_SERVER_ROOT_URL, value: {{ $g.rootUrl | default (printf "%%(protocol)s://%%(domain)s%s/" $g.path) | quote }} }
            - { name: GF_SERVER_SERVE_FROM_SUB_PATH, value: "true" }
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "false" }
            - { name: GF_USERS_ALLOW_SIGN_UP, value: "false" }
            - { name: GF_AUTH_DISABLE_LOGIN_FORM, value: "false" }
            - { name: GF_ANALYTICS_REPORTING_ENABLED, value: "false" }   # no phoning home
            - { name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false" }
            - { name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES, value: "false" }
            - { name: GF_NEWS_NEWS_FEED_ENABLED, value: "false" }
            - { name: GF_PATHS_PROVISIONING, value: /etc/grafana/provisioning }
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml $g.resources | nindent 12 }}
          securityContext:
            {{- include "skillsieve.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: tmp
              mountPath: /tmp
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
              subPath: datasources.yaml
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
      volumes:
        # Stateless: the datasource and dashboards are provisioned from Git on every start.
        - name: data
          emptyDir: { sizeLimit: 256Mi }
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
        - name: provisioning
          configMap:
            name: {{ .Release.Name }}-grafana
            items:
              - { key: datasources.yaml, path: datasources.yaml }
              - { key: dashboards.yaml, path: dashboards.yaml }
        - name: dashboards
          configMap:
            name: {{ .Release.Name }}-grafana
            items:
              {{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
              - { key: {{ base $path }}, path: {{ base $path }} }
              {{- end }}
{{- end }}
