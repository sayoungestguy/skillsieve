# Local dependencies for development. Postgres stands in for Supabase (same major version).
# Start: docker compose -f deploy/local/docker-compose.yml up -d
# RabbitMQ (R2 async extraction): --profile async, then EXTRACTION_MODE=async.
# Elasticsearch: for core-api via spring-boot:run, start it too and set ES_URL=http://localhost:59200.
name: skillsieve
services:
  postgres:
    image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    environment:
      POSTGRES_DB: skillsieve
      POSTGRES_USER: skillsieve_api
      POSTGRES_PASSWORD: skillsieve_api   # local only; never used outside this container
    ports:
      - "127.0.0.1:${PG_PORT:-55432}:5432"   # this machine only (55432 avoids a local Postgres on 5432); the k3d cluster reaches it via host.k3d.internal
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillsieve_api -d skillsieve"]
      interval: 5s
      retries: 10
  elasticsearch:
    image: elasticsearch:8.18.8@sha256:e5b3511e96ee1c58e9027d9d06185be4e627074717b40f6145e860b39c851d6d
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"   # local only, bound to 127.0.0.1
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:${ES_PORT:-59200}:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    profiles: [search]   # only with: docker compose --profile search up -d
  rabbitmq:
    image: rabbitmq:4.1-alpine@sha256:cd4009416f83d7e5895020cd71b0963f3b8a4dfc3de74bbb6fb3bfe5f81f01e0
    environment:
      RABBITMQ_DEFAULT_USER: skillsieve
      RABBITMQ_DEFAULT_PASS: skillsieve   # local only, bound to 127.0.0.1
    ports:
      - "127.0.0.1:${AMQP_PORT:-55672}:5672"
    volumes:
      - mqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10
    profiles: [async]   # only with: docker compose --profile async up -d (Release 2, ADR-006)
volumes:
  mqdata:
  pgdata:
  esdata:
