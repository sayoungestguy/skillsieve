# Production defaults. Secrets come from env vars (TECHNICAL_DESIGN §8); local overrides live in
# application-local.yml (profile "local").
spring:
  application:
    name: core-api
  datasource:
    # SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD from the environment.
    hikari:
      maximum-pool-size: 5   # Supabase free plan connection limit
      minimum-idle: 1
      connection-init-sql: SET search_path TO skillsieve   # raw SQL (JdbcTemplate) resolves our tables
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none         # Flyway owns the schema
    properties:
      hibernate:
        default_schema: skillsieve
        jdbc.time_zone: UTC
  flyway:
    schemas: skillsieve
    default-schema: skillsieve
    create-schemas: true
  jackson:
    default-property-inclusion: always
  rabbitmq:
    # SPRING_RABBITMQ_HOST / _USERNAME / _PASSWORD from the environment (only used in async mode).
    publisher-confirm-type: correlated   # the outbox marks a row sent only after the broker confirms
    listener:
      simple:
        prefetch: 10
        default-requeue-rejected: false   # after retries a failing result goes to core.skills-extracted.dlq
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: native   # real client IP behind Traefik (login rate limit)
  error:
    include-message: never
    include-stacktrace: never

management:
  server:
    port: ${MANAGEMENT_PORT:8081}   # in-cluster only: no Service port, no Ingress (Prometheus scrapes the pod)
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
      show-details: never
      group:
        liveness:
          additional-path: "server:/livez"    # kubelet probes on the app port (pod IP, no ingress)
        readiness:
          additional-path: "server:/readyz"
  health:
    rabbit:
      enabled: false   # broker outages must not fail probes; the outbox buffers
  metrics:
    tags:
      application: core-api
    distribution:
      percentiles-histogram:
        http.server.requests: true   # p50/p95 in Grafana via histogram_quantile

logging:
  structured:
    format:
      console: ecs     # JSON logs to stdout (ARCHITECTURE §7)

springdoc:
  api-docs:
    enabled: false   # on in the local profile only
    path: /v3/api-docs

skillsieve:
  jwt-secret: ${JWT_SECRET:}
  owner-email: ${OWNER_EMAIL:}
  owner-password-hash: ${OWNER_PASSWORD_HASH:}
  cookie-secure: ${COOKIE_SECURE:true}
  skills-svc-url: ${SKILLS_SVC_URL:}
  internal-token: ${INTERNAL_TOKEN:}
  extraction-mode: ${EXTRACTION_MODE:sync}   # async = outbox → RabbitMQ (R2)
  es-url: ${ES_URL:}
