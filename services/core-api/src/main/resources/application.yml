# Production defaults. Secrets come from env vars (TECHNICAL_DESIGN §8); local overrides live in
# application-local.yml (profile "local").
spring:
  application:
    name: core-api
  datasource:
    # SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD from the environment.
    hikari:
      maximum-pool-size: 5   # Supabase free plan connection limit
      minimum-idle: 1
      connection-init-sql: SET search_path TO skillsieve   # raw SQL (JdbcTemplate) resolves our tables
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none         # Flyway owns the schema
    properties:
      hibernate:
        default_schema: skillsieve
        jdbc.time_zone: UTC
  flyway:
    schemas: skillsieve
    default-schema: skillsieve
    create-schemas: true
  jackson:
    default-property-inclusion: always
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: native   # real client IP behind Traefik (login rate limit)
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      base-path: /api/actuator
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  structured:
    format:
      console: ecs     # JSON logs to stdout (ARCHITECTURE §7)

springdoc:
  api-docs:
    enabled: false   # on in the local profile only
    path: /v3/api-docs

skillsieve:
  jwt-secret: ${JWT_SECRET:}
  owner-email: ${OWNER_EMAIL:}
  owner-password-hash: ${OWNER_PASSWORD_HASH:}
  cookie-secure: ${COOKIE_SECURE:true}
